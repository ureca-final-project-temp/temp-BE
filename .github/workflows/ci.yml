name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main  
jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_DB: ubot
          POSTGRES_USER: ubot
          POSTGRES_PASSWORD: ubot_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ubot -d ubot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: test

      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ubot
      POSTGRES_USER: ubot
      POSTGRES_PASSWORD: ubot_test_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build
        run: ./gradlew build -x test