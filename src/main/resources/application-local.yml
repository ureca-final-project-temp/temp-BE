spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ubot}
    username: ${POSTGRES_USER:ubot}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}

    vectorstore:
      pgvector:
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE
management:
  endpoint:
    health:
      show-details: always